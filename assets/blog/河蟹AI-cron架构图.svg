<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="'PingFang SC','Microsoft YaHei','Segoe UI','Segoe UI Emoji','Apple Color Emoji',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="arrW" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      .ttl{font-size:20px;font-weight:700;fill:#0f172a}
      .sub0{font-size:12.5px;fill:#64748b}
      .zl{font-size:12.5px;font-weight:700}
      .nt{font-size:13.5px;font-weight:600;fill:#0f172a}
      .ns{font-size:10.5px;fill:#64748b}
      .el{font-size:11px;fill:#475569}
      .arr{stroke:#64748b;stroke-width:2;fill:none}
      .dash{stroke:#f59e0b;stroke-width:2;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="900" fill="#ffffff"/>
  <text class="ttl" x="450" y="34" text-anchor="middle">🦀 河蟹 AI · 定时任务引擎架构</text>
  <text class="sub0" x="450" y="55" text-anchor="middle">编译期一次推理 · 运行期零 LLM · 能力安全沙箱 · 失败自愈</text>

  <!-- INPUT -->
  <rect x="255" y="72" width="390" height="46" rx="11" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#sh)"/>
  <text class="nt" x="450" y="100" text-anchor="middle">👤 一句话：每天抓榜单入库 / 每周汇总周报</text>
  <line class="arr" x1="450" y1="118" x2="450" y2="150" marker-end="url(#arr)"/>

  <!-- CLASSIFY -->
  <rect x="285" y="150" width="330" height="44" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/>
  <text class="nt" x="450" y="177" text-anchor="middle">🧭 任务分类：机械 → 脚本 · 认知 → Agent</text>
  <line class="arr" x1="450" y1="194" x2="450" y2="216" marker-end="url(#arr)"/>

  <!-- ZONE A: compile -->
  <rect x="36" y="216" width="828" height="104" rx="14" fill="#eef4ff" stroke="#c7d8f5"/>
  <text class="zl" x="54" y="238" fill="#2563eb">① 创建期 · 一次 LLM 编译（之后运行期零 LLM）</text>
  <g filter="url(#sh)">
    <rect x="56" y="250" width="186" height="44" rx="9" fill="#ffffff" stroke="#93b4f3"/>
    <rect x="258" y="250" width="186" height="44" rx="9" fill="#ffffff" stroke="#93b4f3"/>
    <rect x="460" y="250" width="186" height="44" rx="9" fill="#ffffff" stroke="#93b4f3"/>
    <rect x="662" y="250" width="186" height="44" rx="9" fill="#ffffff" stroke="#93b4f3"/>
  </g>
  <text class="nt" x="149" y="277" text-anchor="middle">🔍 解析 · 选模型</text>
  <text class="nt" x="351" y="277" text-anchor="middle">🤖 生成 Starlark</text>
  <text class="nt" x="553" y="277" text-anchor="middle">✅ 安全校验</text>
  <text class="nt" x="755" y="277" text-anchor="middle">💾 序列化入库</text>
  <line class="arr" x1="242" y1="272" x2="258" y2="272" marker-end="url(#arr)"/>
  <line class="arr" x1="444" y1="272" x2="460" y2="272" marker-end="url(#arr)"/>
  <line class="arr" x1="646" y1="272" x2="662" y2="272" marker-end="url(#arr)"/>
  <path class="dash" d="M553,296 C520,316 384,316 351,298" marker-end="url(#arrW)"/>
  <text class="el" x="452" y="316" text-anchor="middle" fill="#b45309">↻ 三层自纠（弱本地模型兜底）</text>

  <line class="arr" x1="450" y1="320" x2="450" y2="344" marker-end="url(#arr)"/>

  <!-- SQLITE -->
  <rect x="250" y="344" width="400" height="50" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#sh)"/>
  <text class="nt" x="450" y="366" text-anchor="middle">🗄️ SQLite · cron_jobs / cron_job_runs</text>
  <text class="ns" x="450" y="382" text-anchor="middle">持久化 · 重启恢复（不丢任务）· 历史写时裁剪</text>
  <line class="arr" x1="450" y1="394" x2="450" y2="418" marker-end="url(#arr)"/>

  <!-- ZONE B: runtime -->
  <rect x="36" y="418" width="828" height="216" rx="14" fill="#ecfdf3" stroke="#bbe7cb"/>
  <text class="zl" x="54" y="440" fill="#16a34a">② 运行期 · 零 LLM（确定性执行）</text>

  <g filter="url(#sh)">
    <rect x="110" y="452" width="320" height="44" rx="10" fill="#ffffff" stroke="#7dd3a8"/>
    <rect x="470" y="452" width="320" height="44" rx="10" fill="#ffffff" stroke="#7dd3a8"/>
  </g>
  <text class="nt" x="270" y="479" text-anchor="middle">⏰ 调度 runLoop（按 nextRunTime）</text>
  <text class="nt" x="630" y="479" text-anchor="middle">🧵 go executeJob（独立协程）</text>
  <line class="arr" x1="430" y1="474" x2="470" y2="474" marker-end="url(#arr)"/>

  <text class="el" x="450" y="514" text-anchor="middle">引擎路由 Runtime?</text>
  <line class="arr" x1="600" y1="496" x2="500" y2="520" marker-end="url(#arr)"/>
  <line class="arr" x1="600" y1="496" x2="660" y2="520" marker-end="url(#arr)"/>

  <g filter="url(#sh)">
    <rect x="56" y="522" width="378" height="62" rx="11" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="466" y="522" width="378" height="62" rx="11" fill="#ffffff" stroke="#7dd3a8"/>
  </g>
  <text class="nt" x="245" y="548" text-anchor="middle">🛡️ Starlark 零能力沙箱</text>
  <text class="ns" x="245" y="566" text-anchor="middle">注入 builtins · 无文件/shell · 8MiB/1e8 步/超时</text>
  <text class="nt" x="655" y="548" text-anchor="middle">🧠 完整 Agent 一轮</text>
  <text class="ns" x="655" y="566" text-anchor="middle">MCP · 文件 · 知识库 · Skill</text>

  <text class="el" x="450" y="606" text-anchor="middle">结果 · 你指定怎么处理</text>
  <line class="arr" x1="245" y1="584" x2="245" y2="616" marker-end="url(#arr)"/>
  <line class="arr" x1="655" y1="584" x2="655" y2="616" marker-end="url(#arr)"/>

  <!-- ZONE C: outputs -->
  <g filter="url(#sh)">
    <rect x="56" y="618" width="378" height="50" rx="11" fill="#fef6ee" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="466" y="618" width="378" height="50" rx="11" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text class="nt" x="245" y="641" text-anchor="middle">⭐ 写回知识库 / 记忆</text>
  <text class="ns" x="245" y="657" text-anchor="middle">闭环：Agent 给自己喂数据，越跑越懂你</text>
  <text class="nt" x="655" y="641" text-anchor="middle">📤 飞书 / Discord / 微信 / 文件</text>
  <text class="ns" x="655" y="657" text-anchor="middle">可选投递（顺带）</text>

  <!-- ZONE D: self-heal -->
  <rect x="36" y="694" width="828" height="118" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="zl" x="54" y="716" fill="#ea580c">③ 失败自愈回路（JIT 去优化同构）</text>
  <g filter="url(#sh)">
    <rect x="60" y="728" width="218" height="44" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <rect x="312" y="728" width="316" height="44" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <rect x="662" y="728" width="186" height="44" rx="10" fill="#ffffff" stroke="#fdba74"/>
  </g>
  <text class="nt" x="169" y="755" text-anchor="middle">⚠️ 脚本连续失败 ×3</text>
  <text class="nt" x="470" y="755" text-anchor="middle">🔧 带失败上下文重编译（24h ≤ 2）</text>
  <text class="nt" x="755" y="755" text-anchor="middle">↩ 更新脚本</text>
  <line class="arr" x1="278" y1="750" x2="312" y2="750" marker-end="url(#arr)"/>
  <line class="arr" x1="628" y1="750" x2="662" y2="750" marker-end="url(#arr)"/>
  <text class="el" x="450" y="794" text-anchor="middle" fill="#b45309">配额耗尽 → 🔔 告警，交还人工　|　脚本无法自愈 ≠ bug，是设计上的终点</text>

  <!-- feedback dashed arrow: self-heal → SQLite -->
  <path class="dash" d="M755,728 C755,690 760,420 690,394" marker-end="url(#arrW)"/>
  <text class="el" x="788" y="560" fill="#b45309" transform="rotate(90 788 560)">↻ 自愈回写新脚本</text>
</svg>

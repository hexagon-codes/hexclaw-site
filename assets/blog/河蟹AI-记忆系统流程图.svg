<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1140" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#9fb6cc" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f8fd4"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6fc9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="1140" fill="#ffffff"/>
  <text x="380" y="33" text-anchor="middle" font-size="17" font-weight="700" fill="#12324c">河蟹 AI 记忆系统 ·「一条记忆的一生」</text>

  <!-- ===== LANE 1 写入 ===== -->
  <rect x="18" y="50" width="724" height="374" rx="14" fill="#edf3fb" stroke="#d3e4f5" stroke-width="1.2"/>
  <text x="38" y="79" font-size="14" font-weight="700" fill="#3f8fd4">① 写入链路 · 抽取 → 去重 → 取代</text>

  <rect x="110" y="92" width="540" height="42" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="118" text-anchor="middle" font-size="14" fill="#12324c">👤 你说　·　🤖 AI 主动　·　✍️ 手改文件</text>
  <line x1="380" y1="134" x2="380" y2="150" stroke="#3f8fd4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="240" y="150" width="280" height="42" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="176" text-anchor="middle" font-size="14" fill="#12324c">🖊️ 单写器：排队 · 原子落盘</text>
  <line x1="380" y1="192" x2="380" y2="208" stroke="#3f8fd4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="215" y="208" width="330" height="42" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="234" text-anchor="middle" font-size="14" fill="#12324c">🔍 去重判定 · 相似度 ≥ 0.65</text>
  <line x1="380" y1="250" x2="380" y2="266" stroke="#3f8fd4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="62" y="266" width="636" height="54" rx="9" fill="#f9fcff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="288" text-anchor="middle" font-size="13.5" fill="#12324c">🆕 新事实 → insert　　　♻️ 改写 → update</text>
  <text x="380" y="309" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3f8fd4">⚡ 矛盾 → supersede（旧条标 ValidTo 留史）</text>
  <line x1="380" y1="320" x2="380" y2="336" stroke="#3f8fd4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="170" y="336" width="420" height="50" rx="9" fill="#1a2332" stroke="#2a3a4e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#d6e4f0">🗄️ markdown ＋ 隐藏 meta</text>
  <text x="380" y="375" text-anchor="middle" font-size="11.5" fill="#9fb6cc">可 cat / git diff / 手改</text>

  <!-- ===== LANE 2 读取 ===== -->
  <rect x="18" y="446" width="724" height="324" rx="14" fill="#eef7fc" stroke="#d3e4f5" stroke-width="1.2"/>
  <text x="38" y="475" font-size="14" font-weight="700" fill="#3f8fd4">② 读取链路 · 每轮组装注入</text>

  <rect x="310" y="488" width="140" height="38" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="512" text-anchor="middle" font-size="14" fill="#12324c">❓ query</text>
  <line x1="350" y1="526" x2="190" y2="556" stroke="#3f8fd4" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="380" y1="526" x2="380" y2="556" stroke="#3f8fd4" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="410" y1="526" x2="570" y2="556" stroke="#3f8fd4" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="558" width="216" height="66" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="148" y="584" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12324c">🏠 常驻冻结（楼顶）</text>
  <text x="148" y="604" text-anchor="middle" font-size="11.5" fill="#5f7b9c">保证带 · 冻结快照</text>

  <rect x="272" y="558" width="216" height="66" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="584" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12324c">🎯 三维打分（检索层）</text>
  <text x="380" y="604" text-anchor="middle" font-size="11.5" fill="#5f7b9c">hybrid 0.7/0.3 · 半衰 30 天</text>

  <rect x="504" y="558" width="216" height="66" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="612" y="584" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12324c">🔦 主动召回（原始层）</text>
  <text x="612" y="604" text-anchor="middle" font-size="11.5" fill="#5f7b9c">FTS 1.5s · 3 条 · 熔断</text>

  <line x1="148" y1="624" x2="330" y2="648" stroke="#3f8fd4" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="380" y1="624" x2="380" y2="648" stroke="#3f8fd4" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="612" y1="624" x2="430" y2="648" stroke="#3f8fd4" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="260" y="648" width="240" height="40" rx="9" fill="#ffffff" stroke="#5fb3ea" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="673" text-anchor="middle" font-size="14" fill="#12324c">🚪 memory 门控 ＋ 围栏</text>
  <line x1="380" y1="688" x2="380" y2="704" stroke="#3f8fd4" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="228" y="704" width="304" height="44" rx="9" fill="#ffffff" stroke="#3f8fd4" stroke-width="2" filter="url(#sh)"/>
  <text x="380" y="731" text-anchor="middle" font-size="14" font-weight="600" fill="#12324c">🧠 注入 system prompt → 模型</text>

  <!-- ===== LANE 3 做梦回路 ===== -->
  <rect x="18" y="792" width="724" height="298" rx="14" fill="#f5f1fb" stroke="#c9bce6" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="38" y="821" font-size="14" font-weight="700" fill="#7a5fc0">③ 做梦后台回路 · opt-in 默认关 · 周期</text>

  <rect x="70" y="834" width="620" height="48" rx="9" fill="#ffffff" stroke="#8a6fc9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="854" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12324c">⚙️ 轻相：机械整理，零 LLM（不可能幻觉）</text>
  <text x="380" y="872" text-anchor="middle" font-size="11.5" fill="#5f7b9c">生命周期状态机：召回 ≥3 晋升 / 降级 / 归档</text>
  <line x1="380" y1="882" x2="380" y2="898" stroke="#8a6fc9" stroke-width="1.6" marker-end="url(#arrowD)"/>

  <rect x="70" y="898" width="620" height="52" rx="9" fill="#ffffff" stroke="#8a6fc9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="918" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12324c">💤 深相：LLM 合成（4 簇 / 8 条 · 有界笼子）</text>
  <text x="380" y="937" text-anchor="middle" font-size="11.5" fill="#5f7b9c">＋ 🔁 回放历史会话　＋ 👤 画像蒸馏 → 置顶</text>
  <line x1="380" y1="950" x2="380" y2="966" stroke="#8a6fc9" stroke-width="1.6" marker-end="url(#arrowD)"/>

  <rect x="200" y="966" width="360" height="42" rx="9" fill="#ffffff" stroke="#8a6fc9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="992" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12324c">🔄 写回 · 仍走单写器 · supersede 留史</text>

  <!-- 反馈回路（虚线，写回存储） -->
  <polyline points="560,987 730,987 730,361 590,361" fill="none" stroke="#8a6fc9" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowD)"/>
  <text x="726" y="676" text-anchor="middle" font-size="11" fill="#8a6fc9" transform="rotate(-90 726 676)">整理后写回记忆</text>

  <text x="380" y="1118" text-anchor="middle" font-size="11.5" fill="#a5bdd3">实线＝主链路　·　紫色虚线＝做梦反馈回路　·　标注常量取自源码</text>
</svg>

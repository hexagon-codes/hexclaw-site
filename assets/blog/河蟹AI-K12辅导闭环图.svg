<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1290" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#12324c" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f8fd4"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa8c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="1290" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="540" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#12324c">河蟹 AI v0.5.0 · K12 家长备课助手 辅导闭环</text>
  <text x="540" y="62" text-anchor="middle" font-size="13.5" fill="#5f7b9c">敏感数据受控出网 · 学习资产本地持久化 · 场景包编译期可移除（源码核验 2026-09-27）</text>

  <!-- 场景包外框 -->
  <rect x="26" y="78" width="1028" height="984" rx="14" fill="none" stroke="#7a63c9" stroke-width="1.8" stroke-dasharray="9 6"/>
  <rect x="640" y="66" width="400" height="24" rx="12" fill="#f3f0fb" stroke="#7a63c9" stroke-width="1"/>
  <text x="840" y="82.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a63c9">📦 scenarios/k12 场景包 · 平台唯一领域词落点</text>

  <!-- ═══ 泳道 ① 拍题与识题 ═══ -->
  <rect x="44" y="98" width="992" height="184" rx="10" fill="#eef7ff" stroke="#bcd9ef" stroke-width="1"/>
  <text x="60" y="124" font-size="14.5" font-weight="700" fill="#2d6da8">① 拍题与识题</text>

  <rect x="60" y="146" width="204" height="112" rx="10" fill="#fff" stroke="#3f8fd4" stroke-width="1.6" filter="url(#sh)"/>
  <text x="162" y="172" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">👤 家长拍作业</text>
  <text x="162" y="196" text-anchor="middle" font-size="11.5" fill="#5f7b9c">桌面会话 · 拍照/粘贴</text>
  <text x="162" y="214" text-anchor="middle" font-size="11.5" fill="#5f7b9c">钉钉私聊</text>
  <text x="162" y="232" text-anchor="middle" font-size="11" fill="#8fa8c0">POST /bind-im 绑实例</text>

  <rect x="308" y="146" width="238" height="112" rx="10" fill="#fff" stroke="#d9634f" stroke-width="1.8" filter="url(#sh)"/>
  <text x="427" y="172" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">🛡️ EgressPolicy 出口网关</text>
  <text x="427" y="196" text-anchor="middle" font-size="11.5" fill="#b04a38">fail-closed：没带信封 = 直接拦</text>
  <text x="427" y="214" text-anchor="middle" font-size="11.5" fill="#5f7b9c">敏感类白名单4 用途</text>
  <text x="427" y="232" text-anchor="middle" font-size="11" fill="#8fa8c0">vision_ocr / vision_chat / solve_verify / memory_profile</text>

  <rect x="590" y="146" width="190" height="112" rx="10" fill="#fff7ea" stroke="#e8963f" stroke-width="1.6" filter="url(#sh)"/>
  <text x="685" y="172" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">🔍 云端 Vision 识题</text>
  <text x="685" y="196" text-anchor="middle" font-size="11.5" fill="#a86a1e">☁️ 出网点之一</text>
  <text x="685" y="214" text-anchor="middle" font-size="11.5" fill="#5f7b9c">照片 → 题目清单</text>
  <text x="685" y="232" text-anchor="middle" font-size="11" fill="#8fa8c0">ImageTaskDispatch 四类分流</text>

  <rect x="824" y="146" width="196" height="112" rx="10" fill="#fff" stroke="#3f8fd4" stroke-width="1.6" filter="url(#sh)"/>
  <text x="922" y="172" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">🔄 自动分类分流</text>
  <text x="922" y="196" text-anchor="middle" font-size="11.5" fill="#5f7b9c">task_intent 四类自动识别</text>
  <text x="922" y="214" text-anchor="middle" font-size="11.5" fill="#5f7b9c">📋 辅导要点内联</text>
  <text x="922" y="232" text-anchor="middle" font-size="11" fill="#8fa8c0">来源标注 📖/🤖/✅/🧠</text>

  <line x1="264" y1="202" x2="304" y2="202" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="546" y1="202" x2="586" y2="202" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="780" y1="202" x2="820" y2="202" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ①→② -->
  <line x1="922" y1="258" x2="922" y2="288" stroke="#3f8fd4" stroke-width="2"/>
  <line x1="922" y1="288" x2="540" y2="288" stroke="#3f8fd4" stroke-width="2"/>
  <line x1="540" y1="288" x2="540" y2="306" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ 泳道 ② 验算证据链 ═══ -->
  <rect x="44" y="310" width="992" height="262" rx="10" fill="#fff7ea" stroke="#ecd9b0" stroke-width="1"/>
  <text x="60" y="336" font-size="14.5" font-weight="700" fill="#a86a1e">② 验算证据链 · engine/solve.go</text>
  <text x="1020" y="336" text-anchor="end" font-size="12" fill="#a86a1e">☁️ 出网点之二：solve_verify（云端强模型）</text>

  <rect x="60" y="354" width="288" height="118" rx="10" fill="#fff" stroke="#e8963f" stroke-width="1.6" filter="url(#sh)"/>
  <text x="204" y="380" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">🧠 Solver · 先跟自己吵一架</text>
  <text x="204" y="404" text-anchor="middle" font-size="11.5" fill="#5f7b9c">自洽采样多数表决 · 上限 5 次</text>
  <text x="204" y="422" text-anchor="middle" font-size="11.5" fill="#5f7b9c">method_diversity 双解法殊途同归</text>
  <text x="204" y="440" text-anchor="middle" font-size="11" fill="#8fa8c0">复杂度 triage：&gt;120 字→hard · ≤30 字→trivial</text>
  <text x="204" y="458" text-anchor="middle" font-size="11" fill="#8fa8c0">Self-Consistency, ICLR 2023</text>

  <rect x="392" y="354" width="296" height="118" rx="10" fill="#fff" stroke="#e8963f" stroke-width="1.6" filter="url(#sh)"/>
  <text x="540" y="380" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">🤖 Verifier · 不许说话只许算</text>
  <text x="540" y="404" text-anchor="middle" font-size="11.5" fill="#5f7b9c">fresh-context 独立重算（maker/checker）</text>
  <text x="540" y="422" text-anchor="middle" font-size="11.5" fill="#b04a38">ToolAllow = [code_exec] 仅此一项</text>
  <text x="540" y="440" text-anchor="middle" font-size="11" fill="#8fa8c0">沙箱 30s 超时 · 禁回环 · seatbelt</text>
  <text x="540" y="458" text-anchor="middle" font-size="11" fill="#8fa8c0">PAL：计算交给解释器执行</text>

  <rect x="732" y="354" width="288" height="118" rx="10" fill="#fff" stroke="#3f8fd4" stroke-width="2.2" filter="url(#sh)"/>
  <text x="876" y="380" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">🧭 verdict 四态 + 数值护栏</text>
  <text x="876" y="404" text-anchor="middle" font-size="11.5" fill="#5f7b9c">agree / disagree / unverifiable</text>
  <text x="876" y="422" text-anchor="middle" font-size="11.5" fill="#b04a38">out_of_scope → 学段内自动重解</text>
  <text x="876" y="440" text-anchor="middle" font-size="11" fill="#8fa8c0">程序比对压过模型口头判定 · 容差 1e-6</text>
  <text x="876" y="458" text-anchor="middle" font-size="11" fill="#8fa8c0">课标白名单：人教数学 四上~初一下</text>

  <line x1="348" y1="413" x2="388" y2="413" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="688" y1="413" x2="728" y2="413" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="240" y="494" width="600" height="58" rx="10" fill="#f4fbff" stroke="#3f8fd4" stroke-width="1.6" filter="url(#sh)"/>
  <text x="540" y="518" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12324c">✅ 徽章诚实：程序验算 = 强 · 同源自检 = 弱（不亮绿灯）· 分歧 = 并列双答请复核</text>
  <text x="540" y="540" text-anchor="middle" font-size="11.5" fill="#5f7b9c">证据六型：numeric_exec / symbolic_exec / heterogeneous_model(须真异构) / heuristic / verbatim / none</text>

  <line x1="876" y1="472" x2="876" y2="483" stroke="#3f8fd4" stroke-width="2"/>
  <line x1="876" y1="483" x2="700" y2="483" stroke="#3f8fd4" stroke-width="2"/>
  <line x1="700" y1="483" x2="700" y2="490" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ②→③ -->
  <line x1="540" y1="552" x2="540" y2="596" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="556" y="582" font-size="11.5" fill="#5f7b9c">批改判错 → 自动入库</text>

  <!-- ═══ 泳道 ③ 错题资产（全本地） ═══ -->
  <rect x="44" y="600" width="992" height="256" rx="10" fill="#eefaf1" stroke="#bfe3cb" stroke-width="1"/>
  <text x="60" y="626" font-size="14.5" font-weight="700" fill="#2e8552">③ 错题资产 · 本机 SQLite 持久化（敏感类默认不出网）</text>

  <rect x="60" y="644" width="300" height="118" rx="10" fill="#fff" stroke="#3fae6a" stroke-width="1.6" filter="url(#sh)"/>
  <text x="210" y="670" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">💾 agent_records 记录原语</text>
  <text x="210" y="694" text-anchor="middle" font-size="11.5" fill="#5f7b9c">migration V8 · 领域中性（积累本=第 2 集）</text>
  <text x="210" y="712" text-anchor="middle" font-size="11.5" fill="#5f7b9c">UNIQUE(agent,collection,dedupe) 幂等去重</text>
  <text x="210" y="730" text-anchor="middle" font-size="11" fill="#8fa8c0">乐观锁 version · 隔离键=不可变 agent_name</text>
  <text x="210" y="748" text-anchor="middle" font-size="11" fill="#8fa8c0">多孩 = 多实例天然隔离 · 删实例级联清数据</text>

  <rect x="404" y="644" width="288" height="118" rx="10" fill="#fff" stroke="#3fae6a" stroke-width="1.6" filter="url(#sh)"/>
  <text x="548" y="670" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">📕 错题本五态状态机</text>
  <text x="548" y="694" text-anchor="middle" font-size="11.5" fill="#5f7b9c">new → explained → retried</text>
  <text x="548" y="712" text-anchor="middle" font-size="11.5" fill="#5f7b9c">→ mastered → archived</text>
  <text x="548" y="730" text-anchor="middle" font-size="11" fill="#8fa8c0">「他会了」可跨阶直达 · 409 乐观锁冲突</text>
  <text x="548" y="748" text-anchor="middle" font-size="11" fill="#8fa8c0">语英默写走 verbatim 一字不差判定</text>

  <rect x="736" y="644" width="284" height="118" rx="10" fill="#fff" stroke="#3fae6a" stroke-width="2.2" filter="url(#sh)"/>
  <text x="878" y="670" text-anchor="middle" font-size="14.5" font-weight="600" fill="#12324c">⏰ 复习引擎 · 艾宾浩斯式阶梯</text>
  <text x="878" y="694" text-anchor="middle" font-size="12" font-weight="600" fill="#2e8552">1 → 3 → 7 → 14 天</text>
  <text x="878" y="712" text-anchor="middle" font-size="11.5" fill="#5f7b9c">掌握 = 连对 2 次且间隔 ≥3 天</text>
  <text x="878" y="730" text-anchor="middle" font-size="11" fill="#8fa8c0">30 天无变化静默归档 · 不制造焦虑</text>
  <text x="878" y="748" text-anchor="middle" font-size="11" fill="#8fa8c0">「再练一道」相似题也要过验算链</text>

  <line x1="360" y1="703" x2="400" y2="703" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="692" y1="703" x2="732" y2="703" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="404" y="782" width="288" height="52" rx="10" fill="#fff" stroke="#8fa8c0" stroke-width="1.4" filter="url(#sh)"/>
  <text x="548" y="804" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12324c">📄 导出 PDF / Word 复习卷 · 📦 .hexbak 备份</text>
  <text x="548" y="823" text-anchor="middle" font-size="11" fill="#8fa8c0">sha256 完整性校验 · 不符拒绝导入</text>

  <line x1="548" y1="762" x2="548" y2="778" stroke="#8fa8c0" stroke-width="1.6" marker-end="url(#arrGrey)"/>

  <!-- ③→④ -->
  <line x1="878" y1="762" x2="878" y2="880" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="894" y="856" font-size="11.5" fill="#5f7b9c">到期队列</text>

  <!-- ═══ 泳道 ④ 自动化投递 ═══ -->
  <rect x="44" y="884" width="992" height="162" rx="10" fill="#f3f0fb" stroke="#d3c9ee" stroke-width="1"/>
  <text x="60" y="910" font-size="14.5" font-weight="700" fill="#6a4fc0">④ 自动化投递 · cron × Starlark（零 LLM）</text>

  <rect x="60" y="928" width="296" height="100" rx="10" fill="#fff" stroke="#7a63c9" stroke-width="1.6" filter="url(#sh)"/>
  <text x="208" y="952" text-anchor="middle" font-size="14" font-weight="600" fill="#12324c">⏰ 4 个默认定时任务</text>
  <text x="208" y="974" text-anchor="middle" font-size="11.5" fill="#5f7b9c">0 19 * * 5 周五复习卷 · 0 20 * * * 复习提醒</text>
  <text x="208" y="992" text-anchor="middle" font-size="11.5" fill="#5f7b9c">学期确认 3/1 u0026 9/1 · 错题卷 · 回传提醒</text>
  <text x="208" y="1010" text-anchor="middle" font-size="11" fill="#8fa8c0">幂等键 agentName/kind · 多孩不互挤</text>

  <rect x="400" y="928" width="296" height="100" rx="10" fill="#fff" stroke="#7a63c9" stroke-width="1.6" filter="url(#sh)"/>
  <text x="548" y="952" text-anchor="middle" font-size="14" font-weight="600" fill="#12324c">🧵 Starlark 沙箱脚本</text>
  <text x="548" y="974" text-anchor="middle" font-size="11.5" fill="#5f7b9c">http_get 拉本机 /api/k12/cron/*</text>
  <text x="548" y="992" text-anchor="middle" font-size="11.5" fill="#b04a38">空内容静默跳过 · 不发废话推送</text>
  <text x="548" y="1010" text-anchor="middle" font-size="11" fill="#8fa8c0">沙箱上限 8MiB / 1e8 步（见 cron 篇）</text>

  <rect x="740" y="928" width="280" height="100" rx="10" fill="#fff" stroke="#7a63c9" stroke-width="1.6" filter="url(#sh)"/>
  <text x="880" y="952" text-anchor="middle" font-size="14" font-weight="600" fill="#12324c">💬 投递到家长眼前</text>
  <text x="880" y="974" text-anchor="middle" font-size="11.5" fill="#5f7b9c">钉钉私聊 · 桌面通知</text>
  <text x="880" y="992" text-anchor="middle" font-size="11.5" fill="#5f7b9c">周五晚打印复习卷 → 周末再练</text>
  <text x="880" y="1010" text-anchor="middle" font-size="11" fill="#8fa8c0">POST /cron/provision 一键注册</text>

  <line x1="356" y1="978" x2="396" y2="978" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="696" y1="978" x2="736" y2="978" stroke="#3f8fd4" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 反馈回路（虚线）：投递 → 再练 → 回到拍题 -->
  <path d="M 1020 978 L 1064 978 L 1064 202 L 1024 202" fill="none" stroke="#8fa8c0" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrGrey)"/>
  <text x="1076" y="590" font-size="11.5" fill="#8fa8c0" transform="rotate(90 1076 590)" text-anchor="middle">🔁 周末再练 · 复习闭环</text>

  <!-- 六缝连接 -->
  <line x1="540" y1="1062" x2="540" y2="1086" stroke="#7a63c9" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrGrey)"/>
  <text x="556" y="1080" font-size="11.5" fill="#7a63c9">只经六缝注入 · 平台不认识"错题"二字</text>

  <!-- ═══ 平台六缝 ═══ -->
  <rect x="44" y="1090" width="992" height="106" rx="10" fill="#eceff7" stroke="#c6cde4" stroke-width="1"/>
  <text x="60" y="1116" font-size="14.5" font-weight="700" fill="#3a4d7a">平台侧 · scenario.Registry 六缝装配（Assemble 纯声明式 · 铁律：无 if pack==k12）</text>

  <g font-size="12.5" font-weight="600" text-anchor="middle">
    <rect x="64"  y="1130" width="150" height="34" rx="17" fill="#fff" stroke="#3a4d7a" stroke-width="1.3"/><text x="139" y="1152" fill="#3a4d7a">Records 记录集</text>
    <rect x="226" y="1130" width="150" height="34" rx="17" fill="#fff" stroke="#3a4d7a" stroke-width="1.3"/><text x="301" y="1152" fill="#3a4d7a">Constraints 约束</text>
    <rect x="388" y="1130" width="150" height="34" rx="17" fill="#fff" stroke="#3a4d7a" stroke-width="1.3"/><text x="463" y="1152" fill="#3a4d7a">Views 视图描述符</text>
    <rect x="550" y="1130" width="150" height="34" rx="17" fill="#fff" stroke="#3a4d7a" stroke-width="1.3"/><text x="625" y="1152" fill="#3a4d7a">Modes 模式路由</text>
    <rect x="712" y="1130" width="150" height="34" rx="17" fill="#fff" stroke="#3a4d7a" stroke-width="1.3"/><text x="787" y="1152" fill="#3a4d7a">Buttons 交互按钮</text>
    <rect x="874" y="1130" width="146" height="34" rx="17" fill="#fff" stroke="#3a4d7a" stroke-width="1.3"/><text x="947" y="1152" fill="#3a4d7a">Evals 质量门</text>
  </g>
  <text x="540" y="1186" text-anchor="middle" font-size="11.5" fill="#8fa8c0">后端 28 条路由经通用 srv.Mount("/api/k12") 挂载 · 桌面端对称：contracts / shell / features-k12 · 视图描述符由后端下发</text>

  <!-- ⭐ 底部横幅 -->
  <rect x="44" y="1214" width="992" height="52" rx="10" fill="#12324c"/>
  <text x="540" y="1246" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">⭐ AP-1 可证伪门：删掉场景包、抹掉装配注册，平台照样编译、照样通用 —— 编译期可移除，才敢做第二个场景</text>
</svg>

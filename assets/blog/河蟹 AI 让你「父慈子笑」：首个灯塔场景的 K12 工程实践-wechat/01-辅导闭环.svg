<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
  <title id="title">从拍作业到下一次练习</title>
  <desc id="desc">拍作业后持久化任务并锁定输入与模型。识题保留题干、本次作答和作答区域。空白题给家长答案与讲法，不记错题、不打勾叉，空白卷只发正文；已答题独立批改，生成正文与真实原图批注，再进入一、三、七、十四天错题复习与练习集、孩子作答回传。合格题库解法可复用，但本次作答仍须识别和独立判定。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#9fb4c9" flood-opacity="0.25"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3f8fd4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4caf7d"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e8943a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8b6fcf"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #12324c; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #5f7b9c; }
    .lane-title { font-size: 27px; font-weight: 700; }
    .node-title { font-size: 28px; font-weight: 650; }
    .body { font-size: 25px; fill: #5f7b9c; }
    .edge { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="1400" fill="#ffffff"/>
  <text class="title" x="500" y="53" text-anchor="middle">从拍作业到下一次练习</text>
  <text class="subtitle" x="500" y="92" text-anchor="middle">先还原这一次作答，再决定辅导与复习动作</text>

  <rect x="30" y="125" width="940" height="190" rx="18" fill="#f4fbff" stroke="#bcdcf3" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="171" style="fill:#3f8fd4">01  接收作业，固定任务输入</text>
  <g id="photo">
    <rect x="60" y="200" width="340" height="81" rx="12" fill="#ffffff" stroke="#3f8fd4" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="230" y="251" text-anchor="middle">拍作业</text>
  </g>
  <g id="task">
    <rect x="540" y="193" width="400" height="100" rx="12" fill="#ffffff" stroke="#3f8fd4" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="740" y="235" text-anchor="middle">持久任务</text>
    <text class="body" x="740" y="273" text-anchor="middle">锁定输入与模型</text>
  </g>
  <path class="edge" d="M400 241 H527" stroke="#3f8fd4" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M740 293 V340 H500 V353" stroke="#3f8fd4" marker-end="url(#arrow-blue)"/>

  <rect x="30" y="365" width="940" height="200" rx="18" fill="#f1faf4" stroke="#bfe6cf" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="412" style="fill:#4caf7d">02  识题，保留本次作答上下文</text>
  <g id="recognition">
    <rect x="60" y="441" width="880" height="89" rx="12" fill="#ffffff" stroke="#4caf7d" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="500" y="496" text-anchor="middle">题干 · 本次作答 · 作答区域</text>
  </g>

  <!-- 空白与已答是互斥业务分支；空白分支不进入错题复习。 -->
  <rect x="30" y="615" width="940" height="275" rx="18" fill="#fff7ee" stroke="#f3d7b0" stroke-width="1.5"/>
  <path class="edge" d="M500 530 V593 H260 V646" stroke="#4caf7d" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M500 593 H740 V646" stroke="#4caf7d" marker-end="url(#arrow-green)"/>
  <g id="blank">
    <rect x="60" y="658" width="400" height="185" rx="12" fill="#ffffff" stroke="#e8943a" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="260" y="701" text-anchor="middle">空白题</text>
    <text class="body" x="260" y="744" text-anchor="middle">给家长答案与讲法</text>
    <text class="body" x="260" y="785" text-anchor="middle">不记错题、不打勾叉</text>
    <text class="body" x="260" y="823" text-anchor="middle">空白卷只发正文</text>
  </g>
  <g id="answered">
    <rect x="540" y="658" width="400" height="185" rx="12" fill="#ffffff" stroke="#e8943a" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="740" y="701" text-anchor="middle">已答题</text>
    <text class="body" x="740" y="758" text-anchor="middle">独立批改本次作答</text>
    <text class="body" x="740" y="809" text-anchor="middle">正文 + 真实原图批注</text>
  </g>
  <path class="edge" d="M740 843 V917 H500 V928" stroke="#e8943a" marker-end="url(#arrow-orange)"/>

  <rect x="30" y="940" width="940" height="270" rx="18" fill="#f5f1fb" stroke="#d4c5ef" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="987" style="fill:#8b6fcf">03  错题复习，连接下一次练习</text>
  <g id="review">
    <rect x="60" y="1030" width="360" height="135" rx="12" fill="#ffffff" stroke="#8b6fcf" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="240" y="1080" text-anchor="middle">错题复习</text>
    <text class="body" x="240" y="1128" text-anchor="middle">1 / 3 / 7 / 14 天</text>
  </g>
  <g id="practice">
    <rect x="560" y="1030" width="380" height="135" rx="12" fill="#ffffff" stroke="#8b6fcf" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="750" y="1080" text-anchor="middle">练习集</text>
    <text class="body" x="750" y="1128" text-anchor="middle">孩子作答回传</text>
  </g>
  <path class="edge" d="M420 1097 H547" stroke="#8b6fcf" marker-end="url(#arrow-purple)"/>

  <rect x="30" y="1253" width="940" height="112" rx="16" fill="#f6f9fc" stroke="#d7e3ed" stroke-width="1.5"/>
  <text x="500" y="1299" text-anchor="middle" font-size="27" font-weight="650">合格题库解法可以复用</text>
  <text class="body" x="500" y="1340" text-anchor="middle">本次作答仍须重新识别、独立判定</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1380" viewBox="0 0 1000 1380" role="img" aria-labelledby="title desc">
  <title id="title">数据边界：保存在哪里，发往哪里</title>
  <desc id="desc">本机 Sidecar 将 SQLite、原图、教材和备份保存在本机；使用云端 Sidecar 时，业务数据位于对应服务所在端。模型调用可选本地或云模型，云模型调用由 egress 检查用途与数据类别；显式启用当前聊天记忆时，general_chat 和 vision_chat 允许 memory。用户绑定的 IM 是独立投递通道，正文和附件会发往 IM 服务商。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#9fb4c9" flood-opacity="0.25"/></filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4caf7d"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8b6fcf"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #12324c; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #5f7b9c; }
    .lane-title { font-size: 27px; font-weight: 700; }
    .node-title { font-size: 28px; font-weight: 650; }
    .body { font-size: 25px; fill: #5f7b9c; }
    .edge { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="1380" fill="#ffffff"/>
  <text class="title" x="500" y="53" text-anchor="middle">数据边界：保存在哪里，发往哪里</text>
  <text class="subtitle" x="500" y="92" text-anchor="middle">保存位置、模型调用、IM 投递是三个不同维度</text>

  <!-- 两种 Sidecar 部署并列说明数据位置，不表示同步或迁移关系。 -->
  <rect x="30" y="125" width="940" height="292" rx="18" fill="#f4fbff" stroke="#bcdcf3" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="174" fill="#3f8fd4">01  数据保存位置：跟随 Sidecar 部署</text>
  <g id="local-storage">
    <rect x="60" y="208" width="420" height="174" rx="12" fill="#ffffff" stroke="#3f8fd4" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="270" y="252" text-anchor="middle">本机 Sidecar</text>
    <text class="body" x="270" y="294" text-anchor="middle">SQLite · 原图 · 教材 · 备份</text>
    <text x="270" y="342" text-anchor="middle" font-size="28" font-weight="650" style="fill:#3f8fd4">保存在本机</text>
  </g>
  <g id="cloud-storage">
    <rect x="520" y="208" width="420" height="174" rx="12" fill="#ffffff" stroke="#3f8fd4" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="730" y="252" text-anchor="middle">云端 Sidecar</text>
    <text class="body" x="730" y="294" text-anchor="middle">业务数据</text>
    <text x="730" y="342" text-anchor="middle" font-size="28" font-weight="650" style="fill:#3f8fd4">保存在对应服务所在端</text>
  </g>

  <!-- 仅模型调用画分支；egress 位于云模型调用路径。 -->
  <rect x="30" y="460" width="940" height="536" rx="18" fill="#f1faf4" stroke="#bfe6cf" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="509" fill="#4caf7d">02  模型调用位置：按选择发起</text>
  <g id="request">
    <rect x="60" y="548" width="265" height="140" rx="12" fill="#ffffff" stroke="#4caf7d" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="192" y="605" text-anchor="middle">Sidecar</text>
    <text class="body" x="192" y="647" text-anchor="middle">发起模型调用</text>
  </g>
  <g id="local-model">
    <rect x="465" y="548" width="475" height="102" rx="12" fill="#ffffff" stroke="#4caf7d" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="702" y="591" text-anchor="middle">本地模型</text>
    <text class="body" x="702" y="627" text-anchor="middle">按当前模型配置调用</text>
  </g>
  <path class="edge" d="M325 599 H452" stroke="#4caf7d" marker-end="url(#arrow-green)"/>
  <text class="body" x="389" y="575" text-anchor="middle">本地</text>
  <g id="egress">
    <rect x="465" y="708" width="250" height="112" rx="12" fill="#ffffff" stroke="#4caf7d" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="590" y="751" text-anchor="middle">egress 检查</text>
    <text class="body" x="590" y="791" text-anchor="middle">用途 + 数据类别</text>
  </g>
  <g id="cloud-model">
    <rect x="780" y="708" width="160" height="112" rx="12" fill="#ffffff" stroke="#4caf7d" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="860" y="774" text-anchor="middle">云模型</text>
  </g>
  <path class="edge" d="M192 688 V764 H452" stroke="#4caf7d" marker-end="url(#arrow-green)"/>
  <text class="body" x="325" y="741" text-anchor="middle">云端</text>
  <path class="edge" d="M715 764 H767" stroke="#4caf7d" marker-end="url(#arrow-green)"/>
  <line x1="60" y1="857" x2="940" y2="857" stroke="#bfe6cf" stroke-width="1.5"/>
  <text class="body" x="60" y="904">显式启用当前聊天记忆时：</text>
  <text x="60" y="949" font-size="26" font-weight="600">general_chat / vision_chat 允许 memory</text>

  <!-- IM 投递与模型调用独立，不绘制二者之间的因果连接。 -->
  <rect x="30" y="1039" width="940" height="238" rx="18" fill="#f5f1fb" stroke="#d4c5ef" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="1088" fill="#8b6fcf">03  IM 投递：独立的外发通道</text>
  <g id="payload">
    <rect x="60" y="1122" width="320" height="113" rx="12" fill="#ffffff" stroke="#8b6fcf" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="220" y="1170" text-anchor="middle">发送正文 / 附件</text>
    <text class="body" x="220" y="1210" text-anchor="middle">应用投递链路</text>
  </g>
  <g id="im">
    <rect x="530" y="1122" width="410" height="113" rx="12" fill="#ffffff" stroke="#8b6fcf" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="735" y="1170" text-anchor="middle">用户绑定的 IM 服务商</text>
    <text class="body" x="735" y="1210" text-anchor="middle">接收发出的正文与附件</text>
  </g>
  <path class="edge" d="M380 1179 H517" stroke="#8b6fcf" marker-end="url(#arrow-purple)"/>
  <text x="500" y="1336" text-anchor="middle" font-size="26" font-weight="600" fill="#5f7b9c">数据是否离开本机，取决于实际调用与投递路径</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="title desc">
  <title id="title">K12 场景包：从资源声明到平台装配</title>
  <desc id="desc">K12 场景资源通过 Manifest v2 声明版本、能力、挂载与工作流，经 Records、Constraints、Views、Modes、Buttons、Evals 六条接入缝接入通用平台。桌面 features/k12 通过注册扩展接入 contracts 与 shell。当前属于源码级装配，不是运行时热插拔。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#9fb4c9" flood-opacity="0.25"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3f8fd4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4caf7d"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8b6fcf"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #12324c; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #5f7b9c; }
    .lane-title { font-size: 27px; font-weight: 700; }
    .node-title { font-size: 28px; font-weight: 650; }
    .body { font-size: 24px; fill: #5f7b9c; }
    .seam { font-size: 27px; font-weight: 650; }
    .edge { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="1220" fill="#ffffff"/>
  <text class="title" x="500" y="53" text-anchor="middle">K12 场景包：从资源声明到平台装配</text>
  <text class="subtitle" x="500" y="92" text-anchor="middle">场景负责组织业务，平台提供明确的接入面</text>

  <!-- 声明层保留资源到 Manifest 的单向装配关系。 -->
  <rect x="30" y="125" width="940" height="210" rx="18" fill="#f4fbff" stroke="#bcdcf3" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="171" fill="#3f8fd4">01  场景资源与装配声明</text>
  <g id="resources">
    <rect x="60" y="201" width="340" height="100" rx="12" fill="#ffffff" stroke="#3f8fd4" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="230" y="243" text-anchor="middle">K12 场景资源</text>
    <text class="body" x="230" y="279" text-anchor="middle">围绕辅导业务组织</text>
  </g>
  <g id="manifest">
    <rect x="490" y="201" width="450" height="100" rx="12" fill="#ffffff" stroke="#3f8fd4" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="715" y="243" text-anchor="middle">Manifest v2</text>
    <text class="body" x="715" y="279" text-anchor="middle">版本 · 能力 · 挂载 · 工作流</text>
  </g>
  <path class="edge" d="M400 251 H479" stroke="#3f8fd4" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M715 301 V355 H500 V372" stroke="#3f8fd4" marker-end="url(#arrow-blue)"/>

  <!-- 六条接入缝并列展示，不暗示彼此之间存在调用顺序。 -->
  <g id="seams">
    <rect x="30" y="384" width="940" height="275" rx="18" fill="#f1faf4" stroke="#bfe6cf" stroke-width="1.5"/>
    <text class="lane-title" x="60" y="430" fill="#4caf7d">02  六条平台接入缝</text>
    <g filter="url(#shadow)" fill="#ffffff" stroke="#4caf7d" stroke-width="1.5">
      <rect x="60" y="461" width="280" height="74" rx="12"/>
      <rect x="360" y="461" width="280" height="74" rx="12"/>
      <rect x="660" y="461" width="280" height="74" rx="12"/>
      <rect x="60" y="556" width="280" height="74" rx="12"/>
      <rect x="360" y="556" width="280" height="74" rx="12"/>
      <rect x="660" y="556" width="280" height="74" rx="12"/>
    </g>
    <text class="seam" x="200" y="507" text-anchor="middle">Records · 记录</text>
    <text class="seam" x="500" y="507" text-anchor="middle">Constraints · 约束</text>
    <text class="seam" x="800" y="507" text-anchor="middle">Views · 视图</text>
    <text class="seam" x="200" y="602" text-anchor="middle">Modes · 模式</text>
    <text class="seam" x="500" y="602" text-anchor="middle">Buttons · 按钮</text>
    <text class="seam" x="800" y="602" text-anchor="middle">Evals · 评估</text>
  </g>
  <path class="edge" d="M500 659 V701" stroke="#4caf7d" marker-end="url(#arrow-green)"/>

  <g id="platform">
    <rect x="30" y="713" width="940" height="162" rx="18" fill="#fff7ee" stroke="#f3d7b0" stroke-width="1.5"/>
    <text class="lane-title" x="60" y="761" fill="#e8943a">03  通用平台</text>
    <text class="node-title" x="500" y="810" text-anchor="middle">按声明装配场景资源与平台能力</text>
    <text class="body" x="500" y="847" text-anchor="middle">场景边界由资源与接入契约共同表达</text>
  </g>

  <!-- 桌面注册关系独立表达，不绘制未经证明的跨层运行时调用。 -->
  <rect x="30" y="919" width="940" height="203" rx="18" fill="#f5f1fb" stroke="#d4c5ef" stroke-width="1.5"/>
  <text class="lane-title" x="60" y="966" fill="#8b6fcf">桌面侧：通过注册扩展接入外壳</text>
  <g id="feature">
    <rect x="60" y="1000" width="340" height="87" rx="12" fill="#ffffff" stroke="#8b6fcf" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="230" y="1054" text-anchor="middle">features/k12</text>
  </g>
  <g id="shell">
    <rect x="565" y="1000" width="375" height="87" rx="12" fill="#ffffff" stroke="#8b6fcf" stroke-width="1.5" filter="url(#shadow)"/>
    <text class="node-title" x="752" y="1054" text-anchor="middle">contracts + shell</text>
  </g>
  <text class="body" x="482" y="1026" text-anchor="middle" style="fill:#8b6fcf">注册扩展</text>
  <path class="edge" d="M400 1052 H552" stroke="#8b6fcf" marker-end="url(#arrow-purple)"/>
  <text x="500" y="1180" text-anchor="middle" font-size="26" font-weight="600" fill="#5f7b9c">当前是源码级装配，不是运行时热插拔</text>
</svg>

<!--
  components/site-header.html
  HexClaw Site Header Component

  This component provides the unified top navigation system across all pages:
  - Responsive logo and brand name
  - Accessible mobile hamburger control (type="button", aria-controls="primary-navigation")
  - In-page anchors for homepages, canonical deep links for subpages
  - Active section highlight (is-active)
  - Accessible language menu (切换语言 / Switch language / تىل ئالماشتۇرۇش)
  - Dark / Light theme toggle with persistence
  - Real-time GitHub star counter badge
-->
<nav class="tn topnav" id="nav">
  <a href="/zh/" class="tn-b topnav-brand">
    <img width="72" height="72" src="../assets/brand/hexclaw-icon-72.png" class="tn-l topnav-logo" alt="河蟹 AI">
    <span class="tn-n topnav-name">河蟹 AI</span>
  </a>
  <button type="button" class="tn-burger topnav-burger" aria-label="菜单" aria-expanded="false" aria-controls="primary-navigation">
    <span></span><span></span><span></span>
  </button>
  <div class="tn-r topnav-links" id="primary-navigation">
    <a href="/zh/">首页</a>
    <a href="/zh/#cases">使用场景</a>
    <a href="/zh/#features">产品能力</a>
    <a href="/zh/#quickstart">开始使用</a>
    <a href="/zh/#ecosystem">开源生态</a>
    <a href="/zh/blog/">技术博客</a>
    <a href="/zh/docs/">文档中心</a>
    <div class="lang-menu" data-lang-menu>
      <button type="button" class="lang-trigger" aria-haspopup="menu" aria-expanded="false" aria-label="切换语言">
        <svg class="lang-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M2 12h20"></path>
          <path d="M12 2a15.3 15.3 0 0 1 0 20"></path>
          <path d="M12 2a15.3 15.3 0 0 0 0 20"></path>
        </svg>
        <span class="lang-current">中文</span>
        <svg class="lang-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </button>
      <div class="lang-menu-list" role="menu">
        <a href="/zh/" role="menuitem" class="is-active" aria-current="true">中文</a>
        <a href="/en/" role="menuitem">English</a>
        <a href="/ug/" role="menuitem" lang="zh-CN" dir="ltr">维吾尔语</a>
      </div>
    </div>
    <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
      <svg class="ti-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
      </svg>
      <svg class="ti-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <a href="https://github.com/hexagon-codes/hexclaw-desktop" target="_blank" rel="noopener noreferrer" class="nav-cta">GitHub <span class="nav-star-badge" id="gh-stars">&#9733;</span></a>
